server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://reservation-api:8080;
    proxy_set_header X-Correlation-ID $request_id;
    proxy_set_header Host $host;
  }

  location = /health {
    proxy_pass http://reservation-api:8080/health;
  }

  location / {
    try_files $uri /index.html;
  }
}
